name: Deploy

on:
  push:
    branches:
      - 'main'
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_checks.yaml

  build:
    needs: checks
    uses: ./.github/workflows/_build.yaml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.filename }}

      - name: Create index.html redirect and robots.txt
        uses: actions/github-script@v8
        env:
          FILENAME: ${{ needs.build.outputs.filename }}
          TITLE: ${{ vars.BUILD_OUTPUT_PAGE_TITLE }}
        with:
          script: |
            const fs = require('fs')

            const filename = process.env.FILENAME
            const title = process.env.TITLE || 'Resume'

            const htmlContent = [
              '<!DOCTYPE html>',
              '<meta charset="utf-8">',
              `<title>${title}</title>`,
              '<meta name="robots" content="noindex, nofollow">',
              `<meta http-equiv="refresh" content="0; url=${filename}">`,
              `<link rel="canonical" href="${filename}">`,
            ].join('\n') + '\n'

            const robotsTxtContent = [
              'User-agent: *',
              'Disallow: /',
            ].join('\n') + '\n'

            fs.writeFileSync('index.html', htmlContent)
            fs.writeFileSync('robots.txt', robotsTxtContent)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
